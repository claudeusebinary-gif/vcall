<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just us</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1012">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Just us">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #15132b;
    --panel: #1f1c3d;
    --line: #342f5f;
    --text: #f4f0ff;
    --muted: #a9a2cf;
    --accent: #ff6b8b;
    --accent-ink: #2a0610;
    --ok: #6ee7b7;
    --danger: #ff5a5a;
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ok); outline-offset: 2px; }

  /* ---------- Lobby ---------- */
  .lobby {
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .lobby-inner { width: 100%; max-width: 440px; }
  h1 {
    font-size: clamp(64px, 18vw, 120px);
    line-height: .9;
    letter-spacing: -0.04em;
    font-weight: 800;
    margin: 0 0 20px;
  }
  .lobby p { color: var(--muted); margin: 0 0 28px; max-width: 36ch; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; min-width: 0;
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 18px;
  }
  input[type=text]::placeholder { color: #6f69a0; }
  .btn {
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary {
    background: var(--accent); color: var(--accent-ink);
    border-color: var(--accent);
    width: 100%; margin-top: 14px; padding: 16px; font-size: 18px; font-weight: 800;
  }
  .btn.primary:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 24px; margin-top: 14px; color: var(--accent); }

  /* ---------- Call ---------- */
  .call {
    height: 100dvh;
    display: grid;
    grid-template-columns: 1fr 340px;
  }
  .stage { position: relative; background: #0d0c1c; overflow: hidden; min-height: 0; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #0d0c1c; }
  .waiting {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 24px;
  }
  .waiting strong { font-size: clamp(28px, 6vw, 44px); font-weight: 800; letter-spacing: -0.02em; }
  .waiting span { color: var(--muted); max-width: 34ch; }
  .waiting .btn { margin-top: 8px; }
  .pip {
    position: absolute; left: 16px; top: 16px;
    width: 120px; aspect-ratio: 3 / 4;
    border-radius: 14px; overflow: hidden;
    border: 2px solid rgba(255,255,255,.25);
    background: #000;
  }
  .pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .pip.off video { opacity: .15; }
  .status {
    position: absolute; right: 16px; top: 16px;
    background: rgba(21,19,43,.8);
    padding: 6px 12px; border-radius: 999px;
    font-size: 14px; display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status.live .dot { background: var(--ok); }
  .controls {
    position: absolute; left: 0; right: 0; bottom: 20px;
    display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    padding: 0 12px;
  }
  .controls .btn { background: rgba(31,28,61,.92); }
  .controls .btn.active { background: var(--text); color: var(--night); border-color: var(--text); }
  .controls .btn.leave { background: var(--danger); border-color: var(--danger); color: #fff; }
  #chatToggle { display: none; position: relative; }
  #chatToggle .unread {
    position: absolute; top: -4px; right: -4px;
    width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
  }

  /* ---------- Chat ---------- */
  .chat {
    background: var(--panel);
    border-left: 1.5px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .chat-head { padding: 16px; border-bottom: 1.5px solid var(--line); font-weight: 800; font-size: 20px; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bubble {
    max-width: 85%; padding: 9px 13px; border-radius: 16px;
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .bubble.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .bubble.them { align-self: flex-start; background: #342f5f; border-bottom-left-radius: 4px; }
  .sys { align-self: center; color: var(--muted); font-size: 14px; }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1.5px solid var(--line); }
  .composer .btn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 800; }

  .float {
    position: absolute; bottom: 110px; font-size: 44px; z-index: 3;
    pointer-events: none; animation: rise 2.6s ease-out forwards;
  }
  @keyframes rise {
    from { transform: translateY(0) scale(.6); opacity: 1; }
    to { transform: translateY(-55vh) scale(1.3); opacity: 0; }
  }
  .shake { animation: shake .5s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-14px); }
    40%, 80% { transform: translateX(14px); }
  }
  .ask {
    position: absolute; left: 50%; top: 22%; transform: translateX(-50%);
    width: min(90%, 420px); z-index: 3;
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 18px;
    padding: 20px; text-align: center;
  }
  .ask p { margin: 0 0 14px; font-size: 22px; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em; }
  .draw { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; touch-action: none; }
  .draw.on { pointer-events: auto; cursor: crosshair; }
  .controls, .status { z-index: 3; }
  .pip { cursor: pointer; z-index: 1; }
  .stage.swap .pip { inset: 0; width: 100%; height: 100%; aspect-ratio: auto; border: 0; border-radius: 0; cursor: default; }
  .stage.swap #remoteVideo {
    position: absolute; left: 16px; top: 16px; width: 120px; height: 160px; z-index: 2;
    border-radius: 14px; border: 2px solid rgba(255,255,255,.25); cursor: pointer;
  }
  @media (max-width: 800px) { .stage.swap #remoteVideo { width: 90px; height: 120px; left: 12px; top: 12px; } }
  .typing { margin-right: auto; margin-left: 10px; font-size: 14px; font-weight: 400; color: var(--muted); }
  .chat-head { display: flex; align-items: center; justify-content: space-between; }
  .chat-close { display: none; padding: 8px 14px; }
  .backdrop { display: none; position: fixed; inset: 0; z-index: 4; background: rgba(13,12,28,.45); }
  .filters {
    flex: 0 0 100%;
    display: flex; gap: 8px; overflow-x: auto;
    padding: 2px 2px 6px;
  }
  .filters .chip:first-child { margin-left: auto; }
  .filters .chip:last-child { margin-right: auto; }
  .chip {
    flex-shrink: 0; white-space: nowrap; cursor: pointer;
    background: rgba(31,28,61,.92); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  @media (max-width: 800px) {
    .call { grid-template-columns: 1fr; }
    .pip { width: 90px; left: 12px; top: 12px; }
    .controls .btn { padding: 10px 13px; font-size: 14px; }
    .chat-close { display: inline-block; }
    body.chat-open .backdrop { display: block; }
    .status { right: 12px; top: 12px; }
    #chatToggle { display: inline-block; }
    .chat {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 62dvh; z-index: 5;
      border-left: 0; border-top: 1.5px solid var(--line);
      border-radius: 18px 18px 0 0;
      transform: translateY(100%);
      transition: transform .2s ease;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    body.chat-open .chat { transform: none; }
  }
  /* ---------- refined minimal theme ---------- */
  :root {
    --night: #0f1012; --panel: #17181b; --line: #26282d;
    --text: #eceef1; --muted: #8a8f98;
    --accent: #e5708a; --accent-ink: #1a0b10; --ok: #5fd3a5;
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: clamp(40px, 9vw, 56px); font-weight: 700; letter-spacing: -0.035em; line-height: 1; margin-bottom: 14px; }
  .lobby p { font-size: 15px; line-height: 1.6; }
  label { font-size: 13px; color: var(--muted); }
  input[type=text] { border-width: 1px; border-radius: 10px; padding: 13px 14px; font-size: 16px; }
  input[type=text]:focus { border-color: var(--muted); }
  .btn { border-width: 1px; border-radius: 10px; font-size: 14px; }
  .btn.primary { font-size: 16px; font-weight: 700; padding: 14px; }
  .stage, #remoteVideo { background: #0a0a0c; }
  .waiting strong { font-size: clamp(22px, 5vw, 30px); font-weight: 700; letter-spacing: -0.02em; }
  .waiting span { font-size: 15px; }
  .pip { border: 1px solid rgba(255,255,255,.18); border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  .status {
    background: rgba(15,16,18,.6); border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .controls {
    flex-direction: column; align-items: center; flex-wrap: nowrap; gap: 10px;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .filters { flex: 0 0 auto; max-width: 100%; }
  .more { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .more .btn { border-radius: 999px; padding: 7px 14px; font-size: 13px; border-color: rgba(255,255,255,.1); }
  .bar {
    display: flex; gap: 4px; padding: 6px; border-radius: 999px;
    background: rgba(15,16,18,.72); border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .controls .btn.icon {
    position: relative; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
    display: grid; place-items: center; background: transparent; color: var(--text);
  }
  .controls .btn.icon:hover { background: rgba(255,255,255,.08); }
  .controls .btn.icon.active { background: var(--text); color: var(--night); }
  .controls .btn.leave.icon { background: #d64545; color: #fff; }
  .controls .btn.leave.icon:hover { background: #e25a5a; }
  #micBtn.active::after, #camBtn.active::after {
    content: ""; position: absolute; inset: 0; margin: auto; width: 26px; height: 2px;
    background: var(--night); transform: rotate(-45deg);
  }
  #chatToggle .unread { top: 9px; right: 9px; }
  @media (max-width: 800px) { .controls .btn.icon#chatToggle { display: grid; } }
  .chat-head { font-size: 16px; }
  .bubble { border-radius: 14px; font-size: 15px; }
  .bubble.them { background: #26282d; }
  .chip { border-width: 1px; font-size: 13px; padding: 6px 12px; background: rgba(15,16,18,.72); }
  .chip.active { background: var(--accent); }
  .pip.screen video { transform: none; object-fit: contain; }
  #remoteVideo.contain { object-fit: contain; }

  /* tools: More tray, panels, filter tiles */
  .more {
    padding: 4px; gap: 2px; border-radius: 22px;
    background: rgba(15,16,18,.72); border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .more .btn { border: 0; background: transparent; border-radius: 18px; padding: 8px 14px; }
  .more .btn:hover { background: rgba(255,255,255,.08); }
  .filters {
    flex-wrap: wrap; justify-content: flex-start; overflow: visible; gap: 8px;
    width: min(92vw, 360px); padding: 14px; border-radius: 18px;
    background: rgba(15,16,18,.84); border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .filters::before { content: attr(aria-label); flex: 0 0 100%; font-size: 13px; font-weight: 700; color: var(--muted); }
  .filters .chip:first-child, .filters .chip:last-child { margin: 0; }
  .filters .chip { background: rgba(255,255,255,.06); border-color: transparent; border-radius: 10px; padding: 8px 12px; }
  .filters .chip:hover { background: rgba(255,255,255,.12); }
  .filters .chip.active { background: var(--accent); color: var(--accent-ink); }
  #qual .chip { flex: 1 1 40%; text-align: center; }
  #fun .chip:nth-child(-n+4) { font-size: 22px; padding: 6px 14px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: 60px; padding: 0; background: none; border: 0; cursor: pointer;
    color: var(--muted); font-size: 11px; font-weight: 600;
  }
  .tile canvas { display: block; width: 60px; height: 76px; border-radius: 10px; border: 2px solid transparent; background: #1a1c20; }
  .tile.active { color: var(--text); }
  .tile.active canvas { border-color: var(--accent); }
  input[type=date] { width: 100%; margin-top: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 16px; color-scheme: dark; }
  .since { color: var(--muted); font-size: 14px; min-height: 20px; margin-top: 8px; }
  .emojis { display: flex; gap: 2px; overflow-x: auto; padding: 6px 10px 0; }
  .emojis button { background: none; border: 0; font-size: 20px; padding: 4px 6px; cursor: pointer; }
  .pip.back video { transform: none; }
  .game { top: 14%; }
  .game .row { justify-content: center; }
  .ttt { display: grid; grid-template-columns: repeat(3, 72px); gap: 6px; justify-content: center; margin-bottom: 14px; }
  .ttt button { height: 72px; font-size: 32px; font-weight: 800; border-radius: 12px; border: 0; background: rgba(255,255,255,.06); color: var(--text); cursor: pointer; }
  .ttt .X { color: var(--accent); }
  .ttt .O { color: var(--ok); }
  .filters:not([hidden]), .more:not([hidden]) { animation: pop .15s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .filters, .more { animation: none !important; } }
  @media (max-width: 800px) { .more .btn { padding: 8px 11px; font-size: 13px; } }

  @media (prefers-reduced-motion: reduce) {
    .chat { transition: none; }
    .float, .shake { animation-duration: .01s; }
  }
</style>
</head>
<body>

<!-- Lobby -->
<main class="lobby" id="lobby">
  <div class="lobby-inner">
    <h1>Just us.</h1>
    <p>A private video call and chat for two. Pick a secret code, share it with her, and you both enter the same room.</p>
    <label for="code">Your secret code</label>
    <div class="row">
      <input type="text" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="at least 6 letters or numbers">
      <button class="btn" id="gen" type="button">Make one</button>
    </div>
    <label for="since" style="margin-top:18px">Together since (optional)</label>
    <input type="date" id="since">
    <div class="since" id="sinceOut"></div>
    <button class="btn primary" id="enter" type="button">Enter room</button>
    <div class="msg" id="lobbyMsg" role="status"></div>
  </div>
</main>

<!-- Call -->
<div class="call" id="call" hidden>
  <section class="stage">
    <video id="remoteVideo" autoplay playsinline></video>
    <div class="waiting" id="waiting">
      <strong id="waitTitle">Waiting for her…</strong>
      <span id="waitSub">Send her your code, or copy the invite link. The call starts as soon as she enters.</span>
      <button class="btn" id="copyLink" type="button">Copy invite link</button>
    </div>
    <canvas class="draw" id="draw"></canvas>
    <div class="pip" id="pip"><video id="selfVideo" autoplay playsinline muted></video></div>
    <div class="ask" id="ask" hidden><p id="askText"></p><button class="btn" id="askClose" type="button">Close</button></div>
    <div class="ask game" id="game" hidden>
      <div class="ttt" id="ttt"></div>
      <p id="gameMsg"></p>
      <div class="row"><button class="btn" id="gameNew" type="button">New game</button><button class="btn" id="gameClose" type="button">Close</button></div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
    <div class="controls">
      <div class="filters" id="qual" hidden aria-label="Her video quality"></div>
      <div class="filters" id="fun" hidden aria-label="Fun"></div>
      <div class="filters" id="filters" hidden aria-label="Camera filters"></div>
      <div class="more" id="more" hidden>
        <button class="btn" id="qualBtn" type="button">Quality</button>
        <button class="btn" id="funBtn" type="button">Fun</button>
        <button class="btn" id="filterBtn" type="button">Filters</button>
        <button class="btn" id="shareBtn" type="button">Share screen</button>
        <button class="btn" id="flipBtn" type="button">Flip camera</button>
      </div>
      <div class="bar">
        <button class="btn icon" id="micBtn" type="button" aria-label="Mute microphone" title="Microphone">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="btn icon" id="camBtn" type="button" aria-label="Turn camera off" title="Camera">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/></svg>
        </button>
        <button class="btn icon" id="chatToggle" type="button" aria-label="Chat" title="Chat">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
          <span class="unread" id="unread" hidden></span>
        </button>
        <button class="btn icon" id="moreBtn" type="button" aria-label="More" title="More">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
        </button>
        <button class="btn icon leave" id="leaveBtn" type="button" aria-label="Leave call" title="Leave">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14.5c5-4 13-4 18 0l-2.2 2.6-3-1.3v-2.4a11 11 0 0 0-5.6 0v2.4l-3 1.3z"/></svg>
        </button>
      </div>
    </div>
  </section>

  <div class="backdrop" id="backdrop"></div>
  <aside class="chat" id="chat" aria-label="Chat">
    <div class="chat-head">Chat <span class="typing" id="typing"></span> <button class="btn chat-close" id="chatClose" type="button">Hide</button></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="emojis" id="emojis"></div>
    <form class="composer" id="composer" autocomplete="off">
      <input type="text" id="msgInput" placeholder="Write a message" maxlength="2000" aria-label="Message">
      <button class="btn" type="submit">Send</button>
    </form>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  // Free public STUN servers. For calls that fail on some mobile networks,
  // add a TURN server here (see README).
  var PEER_CONFIG = {
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun.relay.metered.ca:80" },
        { urls: "turn:global.relay.metered.ca:80", username: "99dcf4dd0e884f11862d58f6", credential: "gg5ZymtKMjb7ZxVX" },

  // Tic-tac-toe: whoever starts the game is X and goes first.

    for (var i = 0; i < LINES.length; i++) {

  var drawOn = false, drawing = false, lastPt = null, drawFade = null;

  function sizeDraw() {
    if (dcv.width !== stage.clientWidth || dcv.height !== stage.clientHeight) {

    }
  }
  function clearDraw() { dctx.clearRect(0, 0, dcv.width, dcv.height); }
  // Your lines are pink, hers are green. Everything fades after 12 quiet seconds.
  function drawSeg(s, mine) {

    drawSeg(s, true);
    if (dataConn && dataConn.open) dataConn.send(s);

  });

    stage.classList.remove("swap");
    facing = "user"; $("pip").classList.remove("back");
    $("game").hidden = true; ttt.over = true;
    if (rec) rec.stop();
    hist = [];
    $("typing").textContent = "";
    Array.prototype.forEach.call($("fun").querySelectorAll(".chip"), function (c) {
      if (c.textContent === "Stop drawing") { c.textContent = "Draw"; c.classList.remove("active"); }
    });
  }

  // Tap your small picture to make it big, tap her small picture to swap back.
  $("pip").addEventListener("click", function () {
    if (!stage.classList.contains("swap")) stage.classList.add("swap");
  });
  $("remoteVideo").addEventListener("click", function () {
    if (stage.classList.contains("swap")) stage.classList.remove("swap");
  });

  var typingTimer = null, lastTypingSent = 0;
  $("msgInput").addEventListener("input", function () {
    if (Date.now() - lastTypingSent > 2000 && dataConn && dataConn.open) {
      lastTypingSent = Date.now();
      dataConn.send({ type: "typing" });
    }
  });
  function showTyping() {
    $("typing").textContent = "typing…";
    clearTimeout(typingTimer);
    typingTimer = setTimeout(function () { $("typing").textContent = ""; }, 2500);
  }

  // ---------- fun stuff ----------
  var EMOJIS = ["❤️", "😂", "😘", "🔥"];
  var QUESTIONS = [
    "Would you rather have a movie night in or a night out?",
    "What’s your favorite memory of us so far?",
    "Would you rather travel the world together or build our dream house?",
    "What’s one thing I do that always makes you smile?",
    "Where should we go on our first trip together?",
    "Would you rather have breakfast in bed every day or dinner by the sea every week?",
    "What song reminds you of us?",
    "What’s something you want us to try together this year?",
    "Describe our perfect lazy Sunday.",
    "What was your first impression of me?",
    "Would you rather teleport to me anytime or pause time whenever we’re together?",
    "What’s one small thing I can do this week to make your day better?"
  ];
  var lastBuzz = 0;

  function sendData(o) {
    if (dataConn && dataConn.open) { dataConn.send(o); return true; }
    addLine("Not connected yet.", "sys");
    return false;
  }

  function floatEmoji(e) {
    var s = document.createElement("span");
    s.className = "float";
    s.textContent = e;
    s.style.left = (10 + Math.random() * 80) + "%";
    s.addEventListener("animationend", function () { s.remove(); });
    document.querySelector(".stage").appendChild(s);
  }

  function buzz(fromMe) {
    var st = document.querySelector(".stage");
    st.classList.remove("shake");
    void st.offsetWidth;
    st.classList.add("shake");
    if (!fromMe && navigator.vibrate) navigator.vibrate([200, 100, 200]);
    addLine(fromMe ? "You buzzed her." : "She buzzed you!", "sys");
  }

  function showAsk(i) {
    var q = QUESTIONS[i];
    if (!q) return;
    $("askText").textContent = q;
    $("ask").hidden = false;
    addLine("Question: " + q, "sys");
  }

  function onData(d) {
    if (!d) return;
    if (d.type === "chat" && typeof d.text === "string") addMsg(d.text.slice(0, 2000), false);
    else if (d.type === "react" && EMOJIS.indexOf(d.emoji) > -1) floatEmoji(d.emoji);
    else if (d.type === "buzz" && Date.now() - lastBuzz > 3000) { lastBuzz = Date.now(); buzz(false); }
    else if (d.type === "ask" && typeof d.i === "number") showAsk(d.i | 0);
    else if (d.type === "quality" && Object.prototype.hasOwnProperty.call(QUALITY, d.q)) { outQuality = d.q; applyQuality(d.q); }
    else if (d.type === "draw" && isFinite(d.x0) && isFinite(d.y0) && isFinite(d.x1) && isFinite(d.y1)) drawSeg(d, false);
    else if (d.type === "clear") clearDraw();
    else if (d.type === "screen") {
      $("remoteVideo").classList.toggle("contain", !!d.on);
      addLine(d.on ? "She’s sharing her screen." : "Screen sharing stopped.", "sys");
    }
    else if (d.type === "typing") showTyping();
    else if (d.type === "ttt") {
      if (d.cmd === "start") tttStart("O");
      else if (d.cmd === "move" && (d.i | 0) >= 0 && (d.i | 0) < 9) tttPlay(d.i | 0, ttt.me === "X" ? "O" : "X");
    }
    else if (d.type === "rec") addLine(d.on ? "She started recording the call." : "She stopped recording.", "sys");
  }

  function drawCover(ctx, v, x, y, w, h, mirror) {
    var vw = v.videoWidth, vh = v.videoHeight;
    if (!vw) return;
    var s = Math.max(w / vw, h / vh), sw = w / s, sh = h / s;
    var sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    if (mirror) { ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(v, sx, sy, sw, sh, 0, 0, w, h); }
    else ctx.drawImage(v, sx, sy, sw, sh, x, y, w, h);
    ctx.restore();
  }

  function takePhoto() {
    var c = document.createElement("canvas");
    c.width = 1280; c.height = 480;
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#15132b";
    ctx.fillRect(0, 0, c.width, c.height);
    drawCover(ctx, $("remoteVideo"), 0, 0, 640, 480, false);
    drawCover(ctx, $("selfVideo"), 640, 0, 640, 480, true);
    var day = new Date().toISOString().slice(0, 10);
    ctx.font = "700 26px sans-serif";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.7)"; ctx.shadowBlur = 6;
    ctx.fillText("Just us, " + day, 20, 460);
    c.toBlob(function (blob) {
      if (!blob) return;
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "just-us-" + day + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      addLine("Photo saved to your device.", "sys");
    }, "image/png");
  }

  function addFun(label, fn) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = label;
    b.addEventListener("click", fn);
    $("fun").appendChild(b);
  }
  EMOJIS.forEach(function (e) {
    addFun(e, function () { if (sendData({ type: "react", emoji: e })) floatEmoji(e); });
  });
  addFun("Buzz", function () { if (sendData({ type: "buzz" })) buzz(true); });
  addFun("Question", function () {
    var i = Math.floor(Math.random() * QUESTIONS.length);
    if (sendData({ type: "ask", i: i })) showAsk(i);
  });
  addFun("Photo", takePhoto);
  addFun("Draw", function () {
    drawOn = !drawOn;
    dcv.classList.toggle("on", drawOn);
    this.classList.toggle("active", drawOn);
    this.textContent = drawOn ? "Stop drawing" : "Draw";
  });
  addFun("Clear", function () {
    clearDraw();
    if (dataConn && dataConn.open) dataConn.send({ type: "clear" });
  });

  addFun("Tic-tac-toe", newGame);
  addFun("Record", function () { toggleRecord(this); });

  $("funBtn").addEventListener("click", function () {
    var box = $("fun");
    box.hidden = !box.hidden;
    this.classList.toggle("active", !box.hidden);
  });
  $("askClose").addEventListener("click", function () { $("ask").hidden = true; });

  // ---------- camera filters ----------
  // Filters are drawn onto a canvas and that picture is what gets sent,
  // so she sees the filter too, not only you.
  var CTX_FILTER = (function () {
    try { return "filter" in document.createElement("canvas").getContext("2d"); } catch (e) { return false; }
  })();
  function lum(d, i) { return 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]; }
  var FILTERS = [
    { id: "none", name: "Normal" },
    { id: "bw", name: "Black & white", px: function (d, i) { var g = (lum(d, i) - 128) * 1.1 + 128; d[i] = g; d[i + 1] = g; d[i + 2] = g; } },
    { id: "warm", name: "Warm", px: function (d, i) { d[i] = d[i] * 1.08 + 10; d[i + 1] = d[i + 1] * 1.02 + 3; d[i + 2] = d[i + 2] * 0.88; } },
    { id: "cool", name: "Cool", px: function (d, i) { d[i] = d[i] * 0.9; d[i + 2] = d[i + 2] * 1.12 + 8; } },
    { id: "vintage", name: "Vintage", px: function (d, i) {
        var r = d[i], g = d[i + 1], b = d[i + 2];
        d[i] = 0.393 * r + 0.769 * g + 0.189 * b + 8;
        d[i + 1] = 0.349 * r + 0.686 * g + 0.168 * b + 4;
        d[i + 2] = 0.272 * r + 0.534 * g + 0.131 * b;
    } },
    { id: "vivid", name: "Vivid", px: function (d, i) {
        var l = lum(d, i);
        d[i] = l + (d[i] - l) * 1.45; d[i + 1] = l + (d[i + 1] - l) * 1.45; d[i + 2] = l + (d[i + 2] - l) * 1.45;
    } }
  ];
  if (CTX_FILTER) FILTERS.push({ id: "soft", name: "Soft glow", blur: "blur(3px) brightness(1.08) saturate(1.1)" });

  var currentFilter = FILTERS[0], fx = null;

  function startFx() {
    if (fx) return true;
    if (!localStream || !HTMLCanvasElement.prototype.captureStream) return false;
    var hv = document.createElement("video");
    hv.muted = true; hv.playsInline = true;
    hv.srcObject = new MediaStream(localStream.getVideoTracks());
    hv.play().catch(function () {});
    var cv = document.createElement("canvas");
    cv.width = 640; cv.height = 480;
    var ctx = cv.getContext("2d", { willReadFrequently: true });
    var out = cv.captureStream(30);
    var timer = setInterval(function () {
      if (hv.readyState < 2 || !hv.videoWidth) return;
      var w = Math.min(hv.videoWidth, 640);
      var h = Math.round(w * hv.videoHeight / hv.videoWidth);
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      var f = currentFilter;
      ctx.filter = f.blur || "none";
      ctx.drawImage(hv, 0, 0, w, h);
      if (f.px) {
        var img = ctx.getImageData(0, 0, w, h), d = img.data;
        for (var i = 0; i < d.length; i += 4) f.px(d, i);
        ctx.putImageData(img, 0, 0);
      }
    }, 40);
    fx = { hv: hv, timer: timer, stream: out, track: out.getVideoTracks()[0] };
    return true;
  }

  function stopFx() {
    if (!fx) return;
    clearInterval(fx.timer);
    fx.track.stop();
    fx.hv.srcObject = null;
    fx = null;
  }

  // Sends the filtered (or plain) camera picture to her and shows it in your small preview.
  function applySendTrack() {
    if (!localStream) return;
    var useFx = !screenTrack && currentFilter.id !== "none" && startFx();
    var track = screenTrack || (useFx ? fx.track : localStream.getVideoTracks()[0]);
    if (mediaCall && mediaCall.peerConnection && track) {
      mediaCall.peerConnection.getSenders().forEach(function (s) {
        if (s.track && s.track.kind === "video") s.replaceTrack(track).catch(function () {});
      });
    }
    $("selfVideo").srcObject = screenStream || (useFx ? fx.stream : localStream);
    if (!useFx) stopFx();
    applyQuality(outQuality);
  }

  function markChips() {
    var chips = $("filters").querySelectorAll(".tile");
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle("active", FILTERS[i] === currentFilter);
    }
  }

  FILTERS.forEach(function (f) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tile";
    b.innerHTML = '<canvas width="60" height="76"></canvas><span></span>';
    b.lastChild.textContent = f.name;
    f.canvas = b.firstChild;
    b.addEventListener("click", function () {
      currentFilter = f;
      markChips();
      applySendTrack();
    });
    $("filters").appendChild(b);
  });
  markChips();

  // One still frame from your camera, shown with each filter applied.
  var rawV = null;
  function drawPreviews() {
    if (!localStream || $("filters").hidden) return;
    if (!rawV) {
      rawV = document.createElement("video");
      rawV.muted = true; rawV.playsInline = true;
      rawV.srcObject = new MediaStream(localStream.getVideoTracks());
      rawV.play().catch(function () {});
    }
    if (rawV.readyState < 2 || !rawV.videoWidth) { setTimeout(drawPreviews, 300); return; }
    FILTERS.forEach(function (f) {
      var c = f.canvas, x = c.getContext("2d", { willReadFrequently: true });
      var w = c.width, h = c.height;
      x.filter = f.blur || "none";
      drawCover(x, rawV, 0, 0, w, h, true);
      x.filter = "none";
      if (f.px) {
        var img = x.getImageData(0, 0, w, h), d = img.data;
        for (var i = 0; i < d.length; i += 4) f.px(d, i);
        x.putImageData(img, 0, 0);
      }
    });
  }

  $("filterBtn").addEventListener("click", function () {
    var box = $("filters");
    box.hidden = !box.hidden;
    if (!box.hidden) drawPreviews();
    this.classList.toggle("active", !box.hidden);
  });

  function resetFilters() {
    currentFilter = FILTERS[0];
    stopFx();
    if (rawV) { rawV.srcObject = null; rawV = null; }
    markChips();
    $("filters").hidden = true;
    $("fun").hidden = true;
    $("funBtn").classList.remove("active");
    $("ask").hidden = true;
    $("filterBtn").classList.remove("active");
  }

  $("moreBtn").addEventListener("click", function () {
    var tray = $("more");
    tray.hidden = !tray.hidden;
    this.classList.toggle("active", !tray.hidden);
    if (tray.hidden) {
      ["qual", "fun", "filters"].forEach(function (id) { $(id).hidden = true; });
      ["qualBtn", "funBtn", "filterBtn"].forEach(function (id) { $(id).classList.remove("active"); });
    }
  });
  $("leaveBtn").addEventListener("click", leave);
  window.addEventListener("beforeunload", function () { if (peer) peer.destroy(); });

  function leave() {
    if (mediaCall) { try { mediaCall.close(); } catch (e) {} }
    if (dataConn) { try { dataConn.close(); } catch (e) {} }
    if (peer) { try { peer.destroy(); } catch (e) {} }
    if (localStream) localStream.getTracks().forEach(function (t) { t.stop(); });
    resetFilters();
    stopTimer();
    resetDraw();
    releaseScreen();
    viewQuality = "auto"; outQuality = "auto";
    markQuality();
    $("qual").hidden = true;
    $("qualBtn").classList.remove("active");
    peer = localStream = dataConn = mediaCall = null;
    $("remoteVideo").srcObject = null;
    $("selfVideo").srcObject = null;
    $("log").textContent = "";
    $("micBtn").setAttribute("aria-label", "Mute microphone"); $("micBtn").classList.remove("active");
    $("camBtn").setAttribute("aria-label", "Turn camera off"); $("camBtn").classList.remove("active");
    $("more").hidden = true; $("moreBtn").classList.remove("active");
    $("pip").classList.remove("off");
    document.body.classList.remove("chat-open");
    $("unread").hidden = true;
    $("call").hidden = true;
    $("lobby").hidden = false;
    $("enter").disabled = false;
    lobbyMsg("");
  }
})();
</script>
</body>
</html>
